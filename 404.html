<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Oops! Page Not Found | STACKLY Art & Design</title>
  <meta name="description" content="The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF5B4D'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='50' fill='white'>S</text></svg>">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="error-page-body">

  <!-- Canvas Wrapper with Dark Theme Ambient Gradient -->
  <main class="error-404-canvas-wrap">
    
    <!-- Atmospheric Ambient Glow behind Window Card -->
    <div class="error-card-ambient-glow"></div>
    <div class="error-404-grid-lines"></div>

    <!-- Centered Glassmorphism Window Card in STACKLY Theme -->
    <div class="error-window-card">
      
      <!-- Window Controls (Three Mac-style Dots) -->
      <div class="error-window-controls">
        <span class="error-control-dot dot-red"></span>
        <span class="error-control-dot dot-yellow"></span>
        <span class="error-control-dot dot-green"></span>
      </div>

      <!-- Big Vibrant Electric Coral & Creative Purple Gradient 404 -->
      <div class="error-big-number">404</div>

      <!-- Heading -->
      <h1 class="error-card-title">Oops! Page Not Found</h1>

      <!-- Subtitle Description -->
      <p class="error-card-desc">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track.
      </p>

      <!-- Action Buttons Styled in STACKLY Coral & Ivory Outline -->
      <div class="error-card-actions">
        <a href="index.html" class="btn-card-primary">
          <i class="bi bi-arrow-left"></i>
          <span>Back To Home</span>
        </a>
        <a href="javascript:void(0);" onclick="if(window.history.length > 1){window.history.back();}else{window.location.href='index.html';}" class="btn-card-secondary" aria-label="Go back to previous page">
          <i class="bi bi-arrow-left"></i>
          <span>Go Back</span>
        </a>
      </div>

    </div>

  </main>

</body>
</html>
